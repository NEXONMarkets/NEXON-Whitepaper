# NEXON 白皮书 · GitBook 站点级同步配置
#
# 结构说明：两个 space 平铺在 site.structure 顶层 = GitBook 的「Site variants」，
# 官方定义为「同一站点发布多个 space，用于本地化与版本发布」，**Free 套餐即包含**。
# ⚠️ 不要套 `type: section` 外层：Site sections 是 Ultimate（$249/site/月）功能。
#
# ⚠️ key 一经上线即为永久标识：改 key 会被判定为「删旧建新」，生成新的 space ID，
#    原 space 脱离站点，且改回 key 也无法恢复。改名改 title，改 URL 改 path。
#
# ⚠️ 资产不跨 space 共享：docs/en 与 docs/zh 各自维护 .gitbook/assets/。

$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: NEXON Whitepaper
  structure:
    - type: space
      key: wp-en
      title: English
      path: docs
      default: true
      content:
        directory: ./docs/en
        language: en
    - type: space
      key: wp-zh
      title: 简体中文
      path: zh
      content:
        directory: ./docs/zh
        language: zh
