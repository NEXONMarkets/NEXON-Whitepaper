<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" style="display:block;background:#FFFFFF"><rect width="760" height="268" fill="#FFFFFF"/><text x="0" y="26" font-size="16" fill="#141414" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" text-anchor="start" font-weight="700" letter-spacing="0">质押越多，每天烧得越多</text><text x="760" y="26" font-size="11.5" fill="#6E7671" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" text-anchor="end" font-weight="400" letter-spacing="0">收益全部提取、立即到账（烧 30%），EXON 按 1.0 U 计</text><line x1="320.1" y1="44" x2="320.1" y2="236" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 4"/><text x="328.11370758349" y="56" font-size="12" fill="#B45309" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" text-anchor="start" font-weight="700" letter-spacing="0">早鸟每日释放 18.26 万枚</text><text x="136" y="97" font-size="14" fill="#141414" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" text-anchor="end" font-weight="700" letter-spacing="0">1,000 万 U</text><rect x="150.0" y="78" width="55.9" height="28" rx="8" fill="#059669" fill-opacity=".18"/><rect x="155.6" y="78" width="50.3" height="28" rx="8" fill="#059669" fill-opacity=".85"/><rect x="209.9" y="80" width="158.1" height="24" fill="#FFFFFF"/><text x="215.88235294117646" y="97" font-size="12.5" fill="#059669" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" text-anchor="start" font-weight="700" letter-spacing="0">0.6 万 – 6 万枚 / 天</text><text x="136" y="151" font-size="14" fill="#141414" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" text-anchor="end" font-weight="700" letter-spacing="0">5,000 万 U</text><rect x="150.0" y="132" width="279.4" height="28" rx="8" fill="#047854" fill-opacity=".18"/><rect x="177.9" y="132" width="251.5" height="28" rx="8" fill="#047854" fill-opacity=".85"/><rect x="433.4" y="134" width="150.5" height="24" fill="#FFFFFF"/><text x="439.4117647058824" y="151" font-size="12.5" fill="#047854" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" text-anchor="start" font-weight="700" letter-spacing="0">3 万 – 30 万枚 / 天</text><text x="136" y="205" font-size="14" fill="#141414" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" text-anchor="end" font-weight="700" letter-spacing="0">1 亿 U</text><rect x="150.0" y="186" width="558.8" height="28" rx="8" fill="#6D3FE0" fill-opacity=".18"/><rect x="205.9" y="186" width="502.9" height="28" rx="8" fill="#6D3FE0" fill-opacity=".85"/><text x="696.8235294117648" y="205" font-size="12.5" fill="#FFFFFF" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" text-anchor="end" font-weight="700" letter-spacing="0">6 万 – 60 万枚 / 天</text><text x="150" y="258" font-size="12" fill="#6E7671" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif" text-anchor="start" font-weight="400" letter-spacing="0">1 亿 U 时最多是日释放的 3.3 倍</text></svg>